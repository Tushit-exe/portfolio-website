<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Tushit Audi</title>
  <meta name="description" content="The page you are looking for does not exist or has been moved.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #080808;
      --text-white: #F5F4F0;
      --text-muted: #888888;
      --font-display: 'Syne', -apple-system, sans-serif;
      --font-body: 'Inter', -apple-system, sans-serif;
    }
    
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2rem;
      overflow-x: hidden;
    }

    .nav-header {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-logo {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--text-white);
      text-decoration: none;
      letter-spacing: -0.03em;
    }

    .main-content {
      max-width: 800px;
      margin: 0 auto;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .error-code {
      font-family: var(--font-display);
      font-size: clamp(6rem, 15vw, 12rem);
      font-weight: 900;
      line-height: 0.9;
      letter-spacing: -0.04em;
      color: transparent;
      -webkit-text-stroke: 2px var(--text-white);
    }

    .error-title {
      font-family: var(--font-display);
      font-size: clamp(1.5rem, 3.5vw, 2.5rem);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: -0.01em;
    }

    .error-desc {
      font-size: 1rem;
      color: var(--text-muted);
      max-width: 460px;
      line-height: 1.6;
    }

    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background-color: var(--text-white);
      color: var(--bg-dark);
      font-family: var(--font-body);
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 1rem 2rem;
      border-radius: 4px;
      margin-top: 1rem;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .btn-home:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    .footer-bar {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>

  <header class="nav-header">
    <a href="/" class="brand-logo">TA</a>
  </header>

  <main class="main-content">
    <div class="error-code">404</div>
    <h1 class="error-title">PAGE NOT FOUND</h1>
    <p class="error-desc">The page you are looking for doesn't exist, has been moved, or is temporarily unavailable.</p>
    <a href="/" class="btn-home">
      <span>RETURN HOME</span>
      &rarr;
    </a>
  </main>

  <footer class="footer-bar">
    &copy; 2026 TUSHIT AUDI. ALL RIGHTS RESERVED.
  </footer>

</body>
</html>
